services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lostfound
      POSTGRES_PASSWORD: lostfound
      POSTGRES_DB: lostfound
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready - U lostfound -d lostfound"]
      interval: 5s
      timeout: 3s
      retries: 10

api:
  build: .
  depends_on:
    db:
      condition: service_healthy
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql://lostfound@db:5432/lostfound
    DATA_DIR: /app/data
  ports:
    - "8000:8000"
  volumes:
    - images:/app/data

volumes:
  pgdata:
  images: